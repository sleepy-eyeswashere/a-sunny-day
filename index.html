<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Letter</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- صفحه اول -->

    <div class="intro" id="intro">


        <div class="icon">

            <div class="mail">

                <div class="paper"></div>

                <div class="seal">
                    ✦
                </div>

            </div>

        </div>



        <h1>
            A Little Letter
        </h1>



        <p>
            "the prettiest day"
        </p>



        <button onclick="openLetter()">
            open
        </button>


    </div>





    <!-- صفحه ستاره ها هنگام باز شدن -->


    <div class="loading" id="loading">


        <div class="stars">

            <span>✦</span>

            <span>✦</span>

            <span>✦</span>

            <span>✦</span>

            <span>✦</span>


        </div>


    </div>






    <!-- نامه -->


    <div class="letter" id="letter">



        <div class="letter-seal">
            ♡
        </div>



        <h2>
            To My Blueberrypie &lt;3
        </h2>



        <div class="subtitle">
            here with you
        </div>





        <div class="letter-text">


            under the blue sky together.


            <br><br>



            maybe on another night,
